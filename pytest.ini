[pytest]
# Pytest configuration for CSV-driven test execution framework

# Base URL for tests
base_url = http://localhost:3000

# Markers
markers =
    devRun: marks tests that run before merge to the main branch
    csv_driven: marks tests that are executed based on CSV configuration

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Addopts (additional options)
addopts =
    --strict-markers
    --tb=short

# Python path
pythonpath =
    src
